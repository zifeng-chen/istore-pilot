apply plugin: 'com.android.application'

android {
    namespace 'com.chaof.istoreos'
    compileSdk 34

    defaultConfig {
        applicationId "com.chaof.istoreos"
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName "0.1.2"
        resConfigs "zh", "en"
    }

    // 签名信息放在 keystore.properties（不进版本库），缺失时退回未签名构建
    signingConfigs {
        release {
            def propFile = rootProject.file('keystore.properties')
            if (propFile.exists()) {
                def props = new Properties()
                propFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }

    // 界面文案直接写在 Java 里，必须锁死 UTF-8，
    // 否则在中文 Windows 上会按 GBK 编译，装到手机上全是乱码。
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 只引 AndroidX / Material，全部可从 Google Maven 拉到。
// 刻意不用 Compose（需要 Kotlin 插件与编译器镜像，链路脆弱），
// 也不引 OkHttp / Gson —— 原生 View + HttpURLConnection + 自带 org.json 足够，
// 包体小、无传递依赖、构建不会因为镜像缺包而失败。
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 图表：带渐变填充、网格、触摸十字准线，自绘版本做不出这种平滑度
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    // 骨架屏没有引 Shimmer：它给整棵子树套 SRC_IN 着色遮罩，
    // 卡片与文字块会被染成同一色，形状全糊。改成自绘脉冲，见 widget/Skeleton.java
    // 弹簧动画：卡片入场用 SpringAnimation，比 accelerate/decelerate 自然
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
