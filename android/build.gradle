// 构建环境说明：本机访问不了 Maven Central 与 services.gradle.org，
// 所以仓库走 Google Maven（dl.google.com 可达）+ 阿里云 central 镜像。
buildscript {
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        // MPAndroidChart 只在 JitPack 上（没有 Maven Central 坐标）。
        // 本机实测 JitPack 可达（产物 tar/aar 都能下），但它是按需构建的，
        // 第一次拉某个版本会慢一点，之后有缓存。
        maven { url 'https://jitpack.io' }
    }
}
