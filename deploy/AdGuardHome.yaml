# AdGuard Home 配置 — 实验模式
# DNS 只监听 127.0.0.1:5353，不碰主链路（dnsmasq 仍在 53 上服务全家）
# 上游指向 OpenClash 的 DNS（7874），保留 fake-ip 分流能力

http:
  address: 0.0.0.0:3000
  session_ttl: 720h

users:
  - name: admin
    # 口令哈希不入库。换成你自己的 bcrypt 哈希再部署：
    #   htpasswd -bnBC 10 "" '你的口令' | tr -d ':\n' | sed 's/$2y/$2b/'
    # 或用 scripts/agh_password.sh 在路由器上就地改写
    password: $2b$10$REPLACE_WITH_YOUR_OWN_BCRYPT_HASHxxxxxxxxxxxxxxxxxxxxxxxxx

auth_attempts: 5
block_auth_min: 1
http_proxy: ""
language: zh-cn
theme: auto

dns:
  bind_hosts:
    - 127.0.0.1
  port: 5353
  # 上游 = OpenClash 的 DNS，AGH 只做过滤，分流仍由 OpenClash 负责
  upstream_dns:
    - 127.0.0.1:7874
  bootstrap_dns:
    - 223.5.5.5
    - 119.29.29.29
  fallback_dns: []
  upstream_mode: parallel
  fastest_timeout: 1s
  cache_size: 4194304
  cache_ttl_min: 60
  cache_ttl_max: 86400
  cache_optimistic: false
  bogus_nxdomain: []
  aaaa_disabled: true
  enable_dnssec: false
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  filtering_enabled: true
  filters_update_interval: 24
  parental_enabled: false
  safebrowsing_enabled: false
  safesearch:
    enabled: false
  serve_plain_dns: true
  hostsfile_enabled: true
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false

tls:
  enabled: false
  server_name: ""
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 784
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  allow_unencrypted_doh: false
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""
  strict_sni_check: false

filters:
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2

whitelist_filters: []

user_rules: []

dhcp:
  enabled: false
  interface_name: ""
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false

clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []

log_file: /tmp/AdGuardHome.log
log_max_backups: 0
log_max_size: 100
log_max_age: 3
log_compress: false
log_localtime: false
verbose: false

os:
  group: ""
  user: ""
  rlimit_nofile: 0

schema_version: 29
