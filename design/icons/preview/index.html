<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iStore Pilot SVG Icon Library</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f7fc;color:#17243b;margin:0;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}.item{background:white;border:1px solid #e3eaf5;border-radius:14px;padding:14px 8px;text-align:center}.item img{width:36px;height:36px;color:#1677df}.name{font-size:12px;margin-top:8px}.label{font-size:12px;color:#64748b;margin-top:3px}h1{font-size:22px}small{color:#64748b}</style></head><body><h1>iStore Pilot SVG 图标库</h1><small id="count"></small><main class="grid" id="grid"></main><script>fetch('../icon-manifest.json').then(r=>r.json()).then(items=>{document.querySelector('#count').textContent=items.length+' icons · 24×24 viewBox · currentColor';document.querySelector('#grid').innerHTML=items.map(i=>`<div class="item"><img src="../${i.path}" alt="${i.label_zh}"><div class="name">${i.name}</div><div class="label">${i.label_zh}</div></div>`).join('')})</script></body></html>
